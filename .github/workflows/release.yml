name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and upload the assets as a workflow artifact without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    env:
      SPC_BOT_TOKEN: ${{ secrets.SPC_BOT_TOKEN }}
      SPC_GUILD_ID: ${{ secrets.SPC_GUILD_ID }}
      SPC_CATEGORY_ID: ${{ secrets.SPC_CATEGORY_ID }}
      SPC_SIGNING_KEY_B64: ${{ secrets.SPC_SIGNING_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Discord credentials
        run: |
          printf 'spc.botToken=%s\nspc.guildId=%s\nspc.categoryId=%s\n' \
            "$SPC_BOT_TOKEN" "$SPC_GUILD_ID" "$SPC_CATEGORY_ID" > local.properties
      - run: ./gradlew check --no-daemon
      - name: Version identity
        if: matrix.java == 21
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          AGENT_VERSION=$(sed -n "s/^version = '\(.*\)'\$/\1/p" agent/build.gradle)
          FALLBACK=$(sed -n 's/.*"\([0-9][0-9.]*\)".*/\1/p' agent/src/main/java/com/serverpackcore/agent/Agent.java)
          test -n "$VERSION"
          test "$VERSION" = "$AGENT_VERSION" || {
            echo "mod_version $VERSION != agent version $AGENT_VERSION"; exit 1; }
          test "$VERSION" = "$FALLBACK" || {
            echo "mod_version $VERSION != Agent.version() fallback $FALLBACK"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$VERSION" = "${GITHUB_REF_NAME#v}" || {
              echo "tag ${GITHUB_REF_NAME} != mod_version $VERSION"; exit 1; }
          fi
      - name: Build release
        if: matrix.java == 21
        run: ./gradlew release --no-daemon
      - name: Stage and sign the manifest
        if: matrix.java == 21
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          mkdir -p staging
          cp agent/build/libs/agent.jar "staging/agent-${VERSION}.jar"
          cp "build/libs/serverpackcore-${VERSION}.jar" "staging/serverpackcore-${VERSION}.jar"
          (cd staging && sha256sum "agent-${VERSION}.jar" "serverpackcore-${VERSION}.jar" > SHA256.txt)
          awk -v ver="$VERSION" '$0 == "## " ver { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > notes.md
          test -s notes.md || echo "Server Pack Core ${VERSION}" > notes.md
          jq -n \
            --arg version "$VERSION" \
            --arg agentUrl "${BASE}/agent-${VERSION}.jar" \
            --arg agentSha256 "$(sha256sum "staging/agent-${VERSION}.jar" | cut -d' ' -f1)" \
            --arg modUrl "${BASE}/serverpackcore-${VERSION}.jar" \
            --arg modSha256 "$(sha256sum "staging/serverpackcore-${VERSION}.jar" | cut -d' ' -f1)" \
            --rawfile notes notes.md \
            '{version: $version, agentUrl: $agentUrl, agentSha256: $agentSha256,
              modUrl: $modUrl, modSha256: $modSha256, notes: $notes}' > staging/update.json
          umask 077
          printf '%s' "$SPC_SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/signing-key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/signing-key.pem" \
            -out staging/update.json.sig staging/update.json
          openssl dgst -sha256 -verify agent/src/main/resources/serverpackcore/update-public.pem \
            -signature staging/update.json.sig staging/update.json
      - name: Upload staged assets
        if: matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: staging/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' || github.event.inputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release
      - name: Verify the signature
        run: |
          openssl dgst -sha256 -verify agent/src/main/resources/serverpackcore/update-public.pem \
            -signature "$RUNNER_TEMP/release/update.json.sig" "$RUNNER_TEMP/release/update.json"
      - name: Keep the dry run assets
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
      - name: Publish
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          awk -v ver="$VERSION" '$0 == "## " ver { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || echo "Server Pack Core ${VERSION}" > "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION}" \
            "$RUNNER_TEMP/release/agent-${VERSION}.jar" \
            "$RUNNER_TEMP/release/serverpackcore-${VERSION}.jar" \
            "$RUNNER_TEMP/release/SHA256.txt" \
            "$RUNNER_TEMP/release/update.json" \
            "$RUNNER_TEMP/release/update.json.sig" \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
