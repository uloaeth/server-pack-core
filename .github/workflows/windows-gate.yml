name: windows-gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/**'
      - 'src/**'
      - 'tools/windows-gate.ps1'
      - '.github/workflows/windows-gate.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'src/**'
      - 'tools/windows-gate.ps1'

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        # 23H2 and 24H2 images; keep both green before releasing.
        os: [windows-2022, windows-2025]
        scenario:
          - outbox-cross-volume
          - atomic-fallback
          - powershell-blocked
          - uninstall
          - hs-err
          - manifest
          - stager-version
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile root (stager) and agent
        run: |
          .\gradlew.bat classes --no-daemon
          .\gradlew.bat -p agent build -PnoObfuscate --no-daemon
          .\gradlew.bat copyAgent verifyAgentBin --no-daemon
      - name: Scenario ${{ matrix.scenario }}
        shell: powershell
        env:
          SPC_AGENT: ${{ github.workspace }}\agent
        run: .\tools\windows-gate.ps1 -Scenario ${{ matrix.scenario }}
      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.os }}-${{ matrix.scenario }}
          path: |
            agent/build/gate/**
            agent/build/reports/tests/**
          if-no-files-found: ignore
