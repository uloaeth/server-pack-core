pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

if (JavaVersion.current() < JavaVersion.VERSION_21) {
	throw new GradleException(
		"JDK 21 or newer is required to build. Current JDK: ${JavaVersion.current()}. " +
		"Set JAVA_HOME to a JDK 21+."
	)
}

rootProject.name = 'serverpackcore'
