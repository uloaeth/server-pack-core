pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

if (JavaVersion.current() < JavaVersion.VERSION_21) {
	throw new GradleException(
		"Se requiere JDK 21 o superior para compilar. JDK actual: ${JavaVersion.current()}. " +
		"Define JAVA_HOME apuntando a un JDK 21+."
	)
}

rootProject.name = 'serverpackcore'
