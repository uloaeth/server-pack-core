plugins {
	id 'fabric-loom' version '1.17.21'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	if (file('LICENSE').exists()) {
		from('LICENSE') {
			rename { "${it}_${project.base.archivesName.get()}" }
		}
	}
}

def mainJar = tasks.named('remapJar').flatMap { it.archiveFile }
def agentJar = layout.projectDirectory.file('agent/build/libs/agent.jar')

tasks.register('verifyBytecode') {
	dependsOn tasks.named('remapJar')
	inputs.file(mainJar)
	inputs.file(agentJar)
	doLast {
		int maxMajor = 61
		[mainJar.get().asFile, agentJar.asFile].each { jarFile ->
			def offenders = []
			new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
				zip.entries().each { entry ->
					if (entry.name.endsWith('.class')) {
						zip.getInputStream(entry).withCloseable { input ->
							byte[] header = input.readNBytes(8)
							if (header.length >= 8) {
								int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
								if (major > maxMajor) {
									offenders << "${entry.name} (major ${major})"
								}
							}
						}
					}
				}
			}
			if (!offenders.isEmpty()) {
				throw new GradleException(
					"${jarFile.name}: classes with bytecode newer than Java 17 (major ${maxMajor}):\n  "
						+ offenders.join('\n  ')
				)
			}
		}
	}
}

tasks.named('check') {
	dependsOn 'verifyBytecode'
}

tasks.named('test') {
	useJUnitPlatform()
	dependsOn 'buildAgent'
}

tasks.register('buildAgent', GradleBuild) {
	dir = file('agent')
	tasks = ['test', 'jar']
	inputs.dir('agent/src')
	inputs.files('agent/build.gradle', 'agent/settings.gradle')
	inputs.files(providers.provider {
		def file = layout.projectDirectory.file('local.properties').asFile
		file.isFile() ? files(file) : files()
	})
	inputs.property('botToken', providers.environmentVariable('SPC_BOT_TOKEN').orElse('SPC_PLACEHOLDER'))
	inputs.property('guildId', providers.environmentVariable('SPC_GUILD_ID').orElse('SPC_PLACEHOLDER'))
	inputs.property('categoryId', providers.environmentVariable('SPC_CATEGORY_ID').orElse('SPC_PLACEHOLDER'))
	outputs.file(agentJar)
}

tasks.register('copyAgent', Copy) {
	dependsOn 'buildAgent'
	from agentJar
	into layout.projectDirectory.dir('src/main/resources/serverpackcore')
	rename { 'agent.bin' }
}

processResources {
	dependsOn 'copyAgent'
}

tasks.named('sourcesJar') {
	dependsOn 'copyAgent'
}

// Publishing guard: a release without burned-in credentials is useless.
def releaseSecretsFile = layout.projectDirectory.file('local.properties')

def releaseSecret = { String key, String envName ->
	providers.provider {
		def properties = new Properties()
		def file = releaseSecretsFile.asFile
		if (file.isFile()) {
			file.withInputStream { properties.load(it) }
		}
		def value = properties.getProperty(key)
		if (value == null || value.trim().isEmpty()) {
			value = System.getenv(envName)
		}
		return value == null ? '' : value.trim()
	}
}

tasks.register('checkSecrets') {
	group = 'verification'
	description = 'Fails when the Discord credentials are missing or still placeholders.'
	doLast {
		def values = [
			'spc.botToken (or SPC_BOT_TOKEN)': releaseSecret('spc.botToken', 'SPC_BOT_TOKEN').get(),
			'spc.guildId (or SPC_GUILD_ID)': releaseSecret('spc.guildId', 'SPC_GUILD_ID').get(),
			'spc.categoryId (or SPC_CATEGORY_ID)': releaseSecret('spc.categoryId', 'SPC_CATEGORY_ID').get()
		]
		def missing = values.findAll { name, value ->
			value.isEmpty() || value.startsWith('SPC_') || value.startsWith('<')
		}.keySet()
		if (!missing.isEmpty()) {
			throw new GradleException(
				'Missing Discord credentials for a release: ' + missing.join(', ')
					+ '. Provide local.properties or the SPC_* environment variables.'
			)
		}
	}
}

tasks.register('release') {
	group = 'publishing'
	description = 'Verifies the credentials and builds the release artifacts.'
	dependsOn 'checkSecrets', 'build'
}
