plugins {
	id 'fabric-loom' version '1.17.21'
}

version = file('version.txt').text.trim()
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	if (file('LICENSE').exists()) {
		from('LICENSE') {
			rename { "${it}_${project.base.archivesName.get()}" }
		}
	}
}

def mainJar = tasks.named('remapJar').flatMap { it.archiveFile }
def agentJar = layout.projectDirectory.file('agent/build/libs/agent.jar')
def agentHash = layout.projectDirectory.file('agent/build/libs/agent.sha256')

tasks.register('verifyBytecode') {
	dependsOn tasks.named('remapJar'), 'buildAgent'
	inputs.file(mainJar)
	inputs.file(agentJar)
	doLast {
		int maxMajor = 61
		[mainJar.get().asFile, agentJar.asFile].each { jarFile ->
			def offenders = []
			new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
				zip.entries().each { entry ->
					if (entry.name.endsWith('.class')) {
						zip.getInputStream(entry).withCloseable { input ->
							byte[] header = input.readNBytes(8)
							if (header.length >= 8) {
								int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
								if (major > maxMajor) {
									offenders << "${entry.name} (major ${major})"
								}
							}
						}
					}
				}
			}
			if (!offenders.isEmpty()) {
				throw new GradleException(
					"${jarFile.name}: classes with bytecode newer than Java 17 (major ${maxMajor}):\n  "
						+ offenders.join('\n  ')
				)
			}
		}
		new java.util.zip.ZipFile(mainJar.get().asFile).withCloseable { zip ->
			def config = zip.getEntry('serverpackcore/config.json')
			if (config == null) {
				throw new GradleException("${mainJar.get().asFile.name}: missing serverpackcore/config.json")
			}
			def text = zip.getInputStream(config).getText('UTF-8')
			if (!text.contains('"build_id"')) {
				throw new GradleException("${mainJar.get().asFile.name}: config.json has no build_id")
			}
			if (zip.getEntry('serverpackcore/agent.bin') == null) {
				throw new GradleException("${mainJar.get().asFile.name}: missing serverpackcore/agent.bin")
			}
			if (zip.getEntry('serverpackcore/agent.sha256') == null) {
				throw new GradleException("${mainJar.get().asFile.name}: missing serverpackcore/agent.sha256")
			}
		}
	}
}

tasks.named('check') {
	dependsOn 'verifyBytecode', 'verifyAgentBin'
}

tasks.named('test') {
	useJUnitPlatform()
	dependsOn 'verifyAgentBin'
}

tasks.register('buildAgent', GradleBuild) {
	dir = file('agent')
	tasks = ['test', 'signAgent']
	// Forward -P flags such as requireSignature/noObfuscate to the nested build.
	startParameter.projectProperties = gradle.startParameter.projectProperties
	inputs.dir('agent/src')
	inputs.files('agent/build.gradle', 'agent/settings.gradle')
	inputs.files(providers.provider {
		def file = layout.projectDirectory.file('local.properties').asFile
		file.isFile() ? files(file) : files()
	})
	inputs.property('botToken', providers.environmentVariable('SPC_BOT_TOKEN').orElse('SPC_PLACEHOLDER'))
	inputs.property('guildId', providers.environmentVariable('SPC_GUILD_ID').orElse('SPC_PLACEHOLDER'))
	inputs.property('categoryId', providers.environmentVariable('SPC_CATEGORY_ID').orElse('SPC_PLACEHOLDER'))
	outputs.file(agentJar)
	outputs.file(agentHash)
	// A new certificate or TSA must re-sign even when the sources are identical.
	outputs.upToDateWhen { false }
}

tasks.register('copyAgent') {
	dependsOn 'buildAgent'
	doLast {
		def dir = layout.projectDirectory.dir('src/main/resources/serverpackcore').asFile
		dir.mkdirs()
		java.nio.file.Files.copy(agentJar.asFile.toPath(), new File(dir, 'agent.bin').toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		java.nio.file.Files.copy(agentHash.asFile.toPath(), new File(dir, 'agent.sha256').toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
}

/** The embedded binary and its sidecar must describe the signed jar exactly. */
/**
 * Only signature metadata is unstable. MANIFEST.MF main attributes, its entry
 * names and META-INF/services are execution surface and MUST be covered; the
 * per-entry digest lines are the only manifest lines removed.
 */
def canonicalDigest(File jar) {
	def digest = java.security.MessageDigest.getInstance('SHA-256')
	def entries = []
	new java.util.zip.ZipFile(jar).withCloseable { zip ->
		zip.entries().each { entry ->
			if (!entry.directory && !(entry.name ==~ /(?i)META-INF\/[^\/]+\.(SF|DSA|RSA|EC)/)) entries << entry.name
		}
	}
	entries.sort().each { name ->
		new java.util.zip.ZipFile(jar).withCloseable { zip ->
			def entry = zip.getEntry(name)
			digest.update(name.getBytes('UTF-8'))
			digest.update((byte) 0)
			zip.getInputStream(entry).withCloseable { input ->
				if (name.equalsIgnoreCase('META-INF/MANIFEST.MF')) {
					def reader = new BufferedReader(new InputStreamReader(input, 'UTF-8'))
					String line
					while ((line = reader.readLine()) != null) {
						if (line ==~ /(?i)[A-Za-z0-9-]+-Digest:.*/) continue
						digest.update((line + '\n').getBytes('UTF-8'))
					}
				} else {
					byte[] buffer = new byte[8192]
					int read
					while ((read = input.read(buffer)) != -1) digest.update(buffer, 0, read)
				}
			}
		}
	}
	return digest.digest().encodeHex().toString()
}

tasks.register('verifyAgentBin') {
	dependsOn 'copyAgent'
	inputs.file(agentJar)
	inputs.file(agentHash)
	inputs.file(layout.projectDirectory.file('src/main/resources/serverpackcore/agent.bin'))
	doLast {
		def expected = new File(layout.projectDirectory.asFile, 'src/main/resources/serverpackcore/agent.sha256').text.trim()
		def actual = canonicalDigest(new File(layout.projectDirectory.asFile, 'src/main/resources/serverpackcore/agent.bin'))
		if (expected != actual) {
			throw new GradleException("agent.bin hash ${actual} does not match agent.sha256 ${expected}; re-run copyAgent")
		}
		def signed = canonicalDigest(agentJar.asFile)
		if (signed != expected) {
			throw new GradleException("agent.sha256 does not match the signed agent.jar")
		}
	}
}

// The release injects the public config again; shipping it here keeps plain
// jars and local smoke tests from ever being config-less.
def universalConfig = layout.projectDirectory.file('console/universal.json')
def generatedConfigDir = layout.buildDirectory.dir('generated/config')
tasks.register('copyUniversalConfig', Copy) {
	onlyIf { universalConfig.asFile.isFile() }
	from universalConfig
	into generatedConfigDir.map { it.dir('serverpackcore') }
	rename { 'config.json' }
}

sourceSets.main.resources.srcDir(generatedConfigDir)

processResources {
	dependsOn 'verifyAgentBin', 'copyUniversalConfig'
}

tasks.named('sourcesJar') {
	dependsOn 'verifyAgentBin', 'copyUniversalConfig'
}

// Publishing guard: the public discord.json is what every installed agent reads.
def publicConfigFile = layout.projectDirectory.file('discord.json')

tasks.register('checkSecrets') {
	group = 'verification'
	description = 'Fails when discord.json is missing, malformed or still has placeholders.'
	doLast {
		def file = publicConfigFile.asFile
		if (!file.isFile()) {
			throw new GradleException('Missing discord.json; the agent reads its credentials from there.')
		}
		def json
		try {
			json = new groovy.json.JsonSlurper().parse(file)
		} catch (Throwable throwable) {
			throw new GradleException('discord.json is not valid JSON: ' + throwable.message)
		}
		def token = (json['botToken'] instanceof String && !json['botToken'].trim().isEmpty())
			? json['botToken'] : json['botTokenB64']
		def missing = ['guildId', 'categoryId'].findAll { key ->
			def value = json[key]
			!(value instanceof String) || value.trim().isEmpty() || value.startsWith('<') || value.startsWith('SPC_')
		}
		if (!(token instanceof String) || token.trim().isEmpty() || token.startsWith('<') || token.startsWith('SPC_')) {
			missing.add('botToken/botTokenB64')
		}
		if (!missing.isEmpty()) {
			throw new GradleException('discord.json has missing or placeholder fields: ' + missing.join(', '))
		}
	}
}

tasks.register('release') {
	group = 'publishing'
	description = 'Verifies the credentials and builds the release artifacts.'
	dependsOn 'checkSecrets', 'build'
}
