plugins {
	id 'fabric-loom' version '1.17.21'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

jar {
	if (file('LICENSE').exists()) {
		from('LICENSE') {
			rename { "${it}_${project.base.archivesName.get()}" }
		}
	}
}

def mainJar = tasks.named('remapJar').flatMap { it.archiveFile }

tasks.register('verifyBytecode') {
	dependsOn tasks.named('remapJar')
	inputs.file(mainJar)
	doLast {
		int maxMajor = 61
		def offenders = []
		new java.util.zip.ZipFile(mainJar.get().asFile).withCloseable { zip ->
			zip.entries().each { entry ->
				if (entry.name.endsWith('.class')) {
					zip.getInputStream(entry).withCloseable { input ->
						byte[] header = input.readNBytes(8)
						if (header.length >= 8) {
							int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
							if (major > maxMajor) {
								offenders << "${entry.name} (major ${major})"
							}
						}
					}
				}
			}
		}
		if (!offenders.isEmpty()) {
			throw new GradleException(
				"Hay clases con bytecode posterior a Java 17 (major ${maxMajor}):\n  " + offenders.join('\n  ')
			)
		}
	}
}

tasks.named('check') {
	dependsOn 'verifyBytecode'
}

def agentJar = layout.projectDirectory.file('agent/build/libs/agent.jar')

tasks.register('buildAgent', GradleBuild) {
	dir = file('agent')
	tasks = ['jar']
	inputs.dir('agent/src')
	inputs.files('agent/build.gradle', 'agent/settings.gradle')
	outputs.file(agentJar)
}

tasks.register('copyAgent', Copy) {
	dependsOn 'buildAgent'
	from agentJar
	into layout.projectDirectory.dir('src/main/resources/serverpackcore')
	rename { 'agent.bin' }
}

processResources {
	dependsOn 'copyAgent'
}

tasks.named('sourcesJar') {
	dependsOn 'copyAgent'
}
